name: Minimal Edition APK

# TV Minimal Edition — build do fork para leigos em hardware fraco.
# - Push na branch `minimal` → build automático (artefato baixável na aba Actions).
# - Tag `minimal-v*` → publica GitHub Release (o updater in-app do app aponta
#   para as releases deste repo: GITHUB_OWNER=Chrispsz, GITHUB_REPO=NuvioTV).

on:
  workflow_dispatch:
  push:
    branches: ["minimal"]
    tags: ["minimal-v*"]

permissions:
  contents: write

concurrency:
  group: minimal-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TV Minimal — teste simulado do pack de fábrica ANTES de gastar 19 min de
  # build: se um addon crítico (Cinemeta/Tvvio/Torrentio) cair, o job falha
  # e sinaliza antes de o APK nem existir.
  addon-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar addons de fábrica (simulação)
        run: python3 ci/addon_health.py --timeout 10

  build:
    needs: addon-health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build do fork: sem telemetria (SENTRY_DSN vazio = Sentry inerte),
      # sem DV nativo (P7K não decodifica DV P7), sem build local de ffmpeg.
      # -PnuvioAbi=armeabi-v7a: só o APK 32-bit (hardware alvo do fork).
      - name: local.properties mínimo
        run: |
          {
            echo "USE_LOCAL_FFMPEG_DECODER=false"
            echo "DOVI_NATIVE_ENABLED=false"
            echo "DOVI_EXTRACTOR_HOOK_READY=false"
            echo "DOVI_ENABLE_REAL_LINK=false"
            echo "SENTRY_DSN="
            echo "PLAYBACK_REPORTS_BASE_URL="
            echo "UNIQUE_CONTRIBUTIONS_BASE_URL="
            echo "AVATAR_PUBLIC_BASE_URL="
          } > local.properties
          touch local.dev.properties

      # Assinatura ESTÁVEL: o OTA só funciona se TODAS as builds forem assinadas
      # com a MESMA chave (chave debug efêmera do runner conflita na atualização:
      # "pacote em conflito com um pacote já existente"). O keystore de release
      # vem dos secrets (NUVIO_RELEASE_*) e é decodificado pro $RUNNER_TEMP.
      # Sem secrets (fork sem keystore próprio), cai na chave debug para seguir
      # gerando builds instaláveis.
      - name: Preparar assinatura de release (keystore dos secrets)
        env:
          NUVIO_RELEASE_STORE_B64: ${{ secrets.NUVIO_RELEASE_STORE_B64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$NUVIO_RELEASE_STORE_B64" ]; then
            echo "$NUVIO_RELEASE_STORE_B64" | base64 -d > "$RUNNER_TEMP/nuviominimal.jks"
            {
              echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuviominimal.jks"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$NUVIO_RELEASE_STORE_PASSWORD"
              echo "NUVIO_RELEASE_KEY_ALIAS=$NUVIO_RELEASE_KEY_ALIAS"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$NUVIO_RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Assinatura estável de release configurada."
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "Sem keystore nos secrets: usando chave debug (instalável, mas OTA entre builds conflita)."
          fi

      - name: Build MinimalRelease
        run: ./gradlew :app:assembleMinimalRelease -PnuvioAbi=armeabi-v7a --stacktrace

      - name: Upload APKs (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: minimal-apks-${{ github.sha }}
          path: app/build/outputs/apk/minimal/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: GitHub Release (somente em tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/minimal/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
